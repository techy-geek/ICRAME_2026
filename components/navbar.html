<header class="main-header">
  <nav class="navbar container">
    <!-- Logo & Brand -->
    <a href="#home" class="nav-brand" aria-label="ICRAME 2026 home page">
      <img src="assets/icons/icrame.png" alt="ICRAME Logo" class="nav-logo">
      <span class="brand-text">ICRAME 2026</span>
    </a>

    <!-- Pure CSS Hamburger Hack using input checkbox -->
    <input type="checkbox" id="menu-toggle" class="menu-checkbox" aria-label="Toggle navigation menu">
    <label for="menu-toggle" class="hamburger" aria-hidden="true">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </label>

    <!-- Navigation Menu -->
    <div class="nav-menu">
      <ul class="nav-links">
        <li><a href="#home" data-route="home">Home</a></li>
        <li><a href="#committees" data-route="committees">Committees</a></li>
        <li><a href="#speakers" data-route="speakers">Speakers</a></li>
        <li><a href="#publications" data-route="publications">Publications</a></li>
        <li><a href="#call-for-papers" data-route="call-for-papers">Call for Papers</a></li>
        <li><a href="#important-dates" data-route="important-dates">Important Dates</a></li>
        <li><a href="#paper-submission" data-route="paper-submission">Paper Submission</a></li>
        <li><a href="#sponsors" data-route="sponsors">Sponsors</a></li>
        <li><a href="#contact" data-route="contact">Contact</a></li>
        <li class="nav-cta"><a href="#registration" data-route="registration" class="btn-register">Register Now</a></li>
      </ul>
    </div>
  </nav>
</header>

<script>
  (function() {
    document.addEventListener('click', function(e) {
      if (e.target.closest('.nav-links a')) {
        var toggle = document.getElementById('menu-toggle');
        if (toggle && window.getComputedStyle(toggle).display !== 'none' || toggle && toggle.checked) {
          toggle.checked = false;
        }
      }
    });
  })();
</script>
